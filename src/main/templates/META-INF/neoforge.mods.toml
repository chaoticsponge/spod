modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Client quality-of-life tools: click automation, durability-aware tool replacement, spawn overlays, hive counters and directional dispenser/observer placement.''' 

[[mixins]]
config="spod.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[15.10.6,16)"
ordering="AFTER"
side="CLIENT"
